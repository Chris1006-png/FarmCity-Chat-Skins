kind = "web"
previewPath = "/"
title = "FarmCity"
description = "Un mundo social pixel-art donde las personas crean su avatar, exploran una plaza compartida, personalizan habitaciones y se encuentran en comunidad."
version = "1.0.0"
id = "artifacts/farmcity"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23739

[services.development]
run = "pnpm --filter @workspace/farmcity run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/farmcity", "run", "build" ]
serve = "static"
publicDir = "artifacts/farmcity/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23739"
BASE_PATH = "/"
